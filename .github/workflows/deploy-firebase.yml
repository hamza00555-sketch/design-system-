name: Deploy Firebase

# Deploying needs a terminal, unless it runs here. Press "Run workflow" on the
# Actions tab and this does what `firebase deploy` would have done on a laptop.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to deploy"
        type: choice
        default: rules-then-functions
        options:
          - rules-then-functions
          - rules-only
          - functions-only

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: miswadah
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Authenticate
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing the FIREBASE_SERVICE_ACCOUNT secret. See DEPLOY.md."
            exit 1
          fi
          echo "$KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Rules first, always: they are the security boundary, and deploying them
      # after the API leaves a window where the database is open.
      - name: Deploy rules and indexes
        if: inputs.what != 'functions-only'
        run: >
          npx firebase deploy --only firestore:rules,firestore:indexes
          --project "$FIREBASE_PROJECT" --non-interactive

      - name: Deploy functions
        if: inputs.what != 'rules-only'
        run: >
          npx firebase deploy --only functions
          --project "$FIREBASE_PROJECT" --non-interactive

      - name: Check it answers
        if: inputs.what != 'rules-only'
        run: |
          URL="https://us-central1-$FIREBASE_PROJECT.cloudfunctions.net/api/api/health"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$URL"; then
              echo ""
              echo "API base: https://us-central1-$FIREBASE_PROJECT.cloudfunctions.net/api"
              exit 0
            fi
            echo "not up yet, retrying in 15s ($attempt/5)"
            sleep 15
          done
          echo "::error::The function deployed but /api/health did not answer."
          exit 1
